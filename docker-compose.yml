services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile
      # BuildKit 国内镜像加速 (镜像源优先级: fnnas > dockerproxy > 1ms > daocloud)
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: freellm-hub-v2:latest
    container_name: freellm-hub
    restart: unless-stopped
    ports:
      - "3303:3030"
    volumes:
      - ./data:/app/data
    environment:
      - HUB_PORT=3030
      - HUB_HOST=0.0.0.0
      - HUB_PUBLIC_URL=
      - HUB_DATA_DIR=/app/data
      - TZ=${TZ:-Asia/Shanghai}
      - NODE_ENV=production
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3030/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
