services:
  freellm-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: freellm-hub:latest
    container_name: freellm-hub
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3030"
      HOST: "0.0.0.0"
      DATABASE_PATH: /app/data/freellm-hub.db
    ports:
      - "0.0.0.0:3030:3030"
    volumes:
      - hub-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3030/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  hub-data:
